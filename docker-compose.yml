version: "3.9"

services:

  # ─────────────────────────────────────────
  # 🗄️ Banco de dados PostgreSQL + pgvector
  # ─────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vet_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/db/migrations:/docker-entrypoint-initdb.d  # roda SQLs na criação
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vet-zap

  # ─────────────────────────────────────────
  # 🤖 Aplicação principal (FastAPI + Agentes)
  # ─────────────────────────────────────────
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: vet_app
    restart: always
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app                    # hot reload em dev
      - ./rag_files:/rag_files        # arquivos da clínica para RAG
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - vet-zap

  # ─────────────────────────────────────────
  # 📊 Dashboard Streamlit (veterinário)
  # ─────────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: vet_dashboard
    restart: always
    env_file: .env
    ports:
      - "8501:8501"
    volumes:
      - ./dashboard:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    networks:
      - vet-zap

  # ─────────────────────────────────────────
  # 🌐 Nginx (apenas em produção)
  # ─────────────────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: vet_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
      - dashboard
    profiles:
      - production   # só sobe com: docker compose --profile production up

volumes:
  postgres_data:

networks:
  vet-zap:
    external: true
